<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Fauna-OB | Cadastro</title>
</head>
<body>
    <main class="formulario">
        <h1>Área de cadastro</h1>
        <form>
            <label for="nome">Digite seu nome e sobrenome:</label>
            <input type="text" id="nome" placeholder="Ex: Jonas" required>
            <label for="email">Digite seu endereço de email:</label>
            <input type="email" id="email" placeholder="Ex: fofinhos@gmail.com" required>
            <label for="senha">Crie uma senha para sua conta:</label>
            <input type="password" id="senha" placeholder="Crie uma senha" required>
            <button class="botao" type="submit">Cadastrar</button>
        </form>
        <h4>Já tem uma conta? <a href="login.html">Clique aqui</a> para entrar.</h4>
        <a href="index.html">Voltar para Home</a>
    </main>
</body>
</html>
