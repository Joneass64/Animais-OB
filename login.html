<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Fauna-OB | Login</title>
</head>
<body>
    <main class="formulario">
        <h1>Área de login</h1>
        <form>
            <label for="email">Digite seu endereço de email:</label>
            <input type="email" id="email" placeholder="Ex: fofinhos@gmail.com" required>
            <label for="senha">Digite sua senha:</label>
            <input type="password" id="senha" placeholder="Sua senha" required>
            <button class="botao" type="submit">Entrar</button>
        </form>
        <h4>Não possui uma conta? <a href="cadastro.html">Clique aqui</a> para se registrar.</h4>
        <a href="index.html">Voltar para Home</a>
    </main>
</body>
</html>
